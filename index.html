async function scan(){$('#v').innerHTML=`<div class=f><b>${t('scanH')}</b><video id=vd playsinline muted style="width:100%;border-radius:16px;margin-top:8px;background:#000"></video><canvas id=cv hidden></canvas><div class=sb><input id=qm placeholder="${t('qm')}" onkeydown="if(event.key=='Enter')qgo(this.value)"><button onclick="qgo($('#qm').value)">OK</button></div></div>`;
try{ST=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vd');v.srcObject=ST;await v.play();const bd='BarcodeDetector'in window?new BarcodeDetector({formats:['qr_code']}):null;
const tick=async()=>{if(!ST)return;let r=null;try{if(bd){const b=await bd.detect(v);if(b[0])r=b[0].rawValue}else if(window.jsQR&&v.videoWidth){const c=$('#cv'),x=c.getContext('2d');c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(q)r=q.data}}catch(e){}
if(r){qgo(r);return}setTimeout(tick,250)};tick()}catch(e){alert(t('cm'))}}
const bub=(r,x)=>{const d=document.createElement('div');d.className='bb '+r;d.textContent=x;$('#chat').appendChild(d);d.scrollIntoView({block:'end'});return d};
function ai(tid){CH=[];$('#v').innerHTML=`<div class=f><b>${ic('ai')} ${t('ai')}</b><div id=chat class=chat></div><div class=sb><input id=aq placeholder="${t('aiH')}" onkeydown="if(event.key=='Enter')ask(${tid||0})"><button onclick="ask(${tid||0})">${t('send')}</button></div></div>`;bub('model',t('hi'))}
async function ask(tid){const q=$('#aq').value.trim();if(!q)return;$('#aq').value='';bub('user',q);CH.push({role:'user',text:q});const w=bub('model','…');
try{const r=await api('ai','POST',{msgs:CH,tree:tid||null,lang:LN[lang]});CH.push({role:'model',text:r.text});w.textContent=r.text}catch(e){CH.pop();w.textContent=e.message=='ai_off'?t('aiOff'):t('aiFail')+(e.why?' ['+String(e.why).slice(0,160)+']':'')}}
function auth(m='in'){const h0=`<input id=l placeholder="👤 ${t('lg')}" autocapitalize=off autocomplete=username><input id=p type=password placeholder="🔒 ${t('pw')}" autocomplete=current-password onkeydown="if(event.key=='Enter')${m=='in'?'doIn()':'doUp()'}">`;
const h=m=='in'?h0+`<button onclick="doIn()">${t('in')}</button>`:`<input id=ism placeholder="${t('nm')}"><input id=fam placeholder="${t('sn')}"><input id=age type=number placeholder="${t('ag')}"><input id=job maxlength=60 placeholder="${t('jbH')}">`+h0+`<button onclick="doUp()">${t('up')}</button>`;
$('#v').innerHTML=`<div class=hero style="text-align:center"><div class=big id=bl></div><h2>Ecosystem</h2><p>${t('tag')}</p></div><div class=f><div class=seg>${['in','up'].map(x=>`<button class="${m==x?'on':''}" onclick="auth('${x}')">${t(x)}</button>`).join('')}</div>${h}</div>`;$('#bl').innerHTML=LOGO}
async function after(){U=await api('me');go(ADM()?'admin':'home')}
async function doIn(){try{await api('login','POST',{login:$('#l').value,pw:$('#p').value});after()}catch(e){alert(t('err'))}}
async function doUp(){if($('#l').value.trim().length<6||$('#p').value.length<6||!$('#ism').value.trim()||!$('#fam').value.trim())return alert(t('err'));try{await api('register','POST',{ism:$('#ism').value,familya:$('#fam').value,yosh:$('#age').value,kasb:$('#job').value,login:$('#l').value,pw:$('#p').value});after()}catch(e){alert(t('err'))}}
async function prof(){const u=U,own=ADM()?'':`<input id=ism value="${esc(u.ism)}" placeholder="${t('nm')}"><input id=fam value="${esc(u.familya)}" placeholder="${t('sn')}"><input id=age type=number value="${esc(u.yosh)}" placeholder="${t('ag')}"><input id=job maxlength=60 value="${esc(/^j[123]$/.test(u.kasb)?t(u.kasb):u.kasb)}" placeholder="${t('jbH')}"><input id=l value="${esc(u.login)}" placeholder="${t('lg')}"><input id=p type=password placeholder="${t('np')}"><button onclick="saveP()">${t('sv')}</button>`;
let mine='';
if(!ADM()){try{const[d,q]=await Promise.all([api('trees'),api('me/delreq')]);TR=d.trees;RQ=q.reqs}catch(e){RQ=[]}
const my=TR.filter(x=>x.uid==u.id);
mine=`<div class=f><h3 style="margin:0 0 6px">${ic('tree')} ${t('myT')} (${my.length})</h3>${my.map(x=>{const r=RQ.find(z=>z.tid==x.id),pd=r&&r.st=='p';return `<div class=mini><img src="${esc(x.imgs[0])}" onclick="go('tree',${x.id})"><div style="flex:1"><b>${code(x.id)}</b> ${esc(x.nomi)}<br><small>${fmt(x.at)}</small>${pd?`<br><small class=pend>⏳ ${t('drPend')}</small>`:r?`<br><small class=rej>${t('drRej')}</small>`:''}</div><button class="g s" onclick="go('tree',${x.id})">${ic('eye')}</button>${pd?'':`<button class="d s" title="${t('dr')}" onclick="askDel(${x.id})">${ic('trash')}</button>`}</div>`}).join('')||`<small>${t('noT')}</small>`}</div>`}
$('#v').innerHTML=`<div class=f><h3 style="margin:0 0 6px">${ic('user')} ${esc(u.ism||u.login)} ${esc(u.familya||'')}</h3>${own}${DP?`<button class=g onclick="DP.prompt()">${t('inst')}</button>`:''}<button class=d onclick="out()">${t('out')}</button></div>`+mine}
function askDel(i){const m=document.createElement('div');m.className='md';m.id='md';m.innerHTML=`<div><h3 style="margin:0 0 6px">${ic('trash')} ${t('dr')}</h3><small>${t('drWhy')}</small><textarea id=dsb rows=4 maxlength=1000 placeholder="${t('why')}"></textarea><div class=r><button class=g onclick="$('#md').remove()">${t('cancel')}</button><button class=d onclick="sendDel(${i})">${t('drSend')}</button></div></div>`;document.body.appendChild(m);$('#dsb').focus()}
async function sendDel(i){const s=$('#dsb').value.trim();if(s.length<5)return alert(t('drShort'));try{await api('trees/'+i+'/delreq','POST',{sabab:s});$('#md').remove();alert(t('drOk'));go('prof')}catch(e){alert(e.message=='pending'?t('drPend'):t('err'))}}
async function saveP(){try{await api('me','PUT',{ism:$('#ism').value,familya:$('#fam').value,yosh:$('#age').value,kasb:$('#job').value,login:$('#l').value,pw:$('#p').value});U=await api('me');alert(t('ok'))}catch(e){alert(t('err'))}}
async function out(){await api('logout','POST');U=null;go('auth')}
async function admin(){const d=await api('admin/users'),n=d.users.reduce((a,u)=>a+u.trees.length,0),
rq=`<div class=f><b>${ic('trash')} ${t('reqs')} (${d.reqs.length})</b>${d.reqs.map(r=>`<div class=mini style="align-items:flex-start;flex-wrap:wrap"><img src="${esc(r.imgs[0])}"><div style="flex:1;min-width:150px"><b>${code(r.tid)}</b> ${esc(r.nomi)}<br><small>${esc(r.ism)} ${esc(r.familya)} (${esc(r.login)}) · ${fmt(r.at)}</small><div class=why><b>${t('why')}:</b> ${esc(r.sabab)}</div></div><div style="display:flex;gap:6px;width:100%"><button class="d s" style="flex:1" onclick="decide(${r.id},1)">${t('del')}</button><button class="g s" style="flex:1" onclick="decide(${r.id},0)">${t('rjB')}</button></div></div>`).join('')||'<small>—</small>'}</div>`;
$('#v').innerHTML=`<div class=hero><h2>${ic('admin')} ${t('adm')}</h2><div class=st><div><b>${d.users.length}</b>${t('usr')}</div><div><b>${n}</b>${t('tot')}</div></div></div>${rq}<div class=f><b>☁️ JSONBin</b><p>${d.cloud?(d.sync.ok===false?'❌ '+esc(d.sync.err):d.sync.ok?'✅ '+t('cloudOk')+': '+fmt(d.sync.at):'⏳'):t('cloudOff')}</p><button class=g onclick="syncNow()">${t('cloudB')}</button></div><div class=f><b>${t('cr')}</b><input id=al placeholder="Login"><input id=ap type=password placeholder="${t('np')}"><button onclick="creds()">${t('sv')}</button></div><div class=f><b>${t('logs')}</b>${d.logs.map(l=>`<p style="margin:5px 0"><small>${fmt(l.at)}</small> — ${esc(l.ism)} ${esc(l.familya)} <small>(${esc(l.login)})</small></p>`).join('')||'—'}</div>`+
d.users.map(u=>`<div class=f><b>${esc(u.ism)} ${esc(u.familya)}</b> · ${esc(u.yosh)} · ${/^j[123]$/.test(u.kasb)?t(u.kasb):esc(u.kasb)}<br>👤 ${esc(u.login)}<br><small>${t('rd')}: ${fmt(u.at)}<br>${t('ll')}: ${fmt(u.last)} · ${t('ent')}: ${u.logins}</small><p>🌳 <b>${u.trees.length}</b> ${t('dn')}</p>${u.trees.map(x=>`<div class=mini><img src="${esc(x.imgs[0])}"><div style="flex:1"><b>${code(x.id)}</b> ${esc(x.nomi)}<br><small>${t(x.turi)} · ${fmt(x.at)}</small></div><button class="g s" onclick="go('tree',${x.id})">${ic('eye')}</button><button class="d s" onclick="delT(${x.id})">${ic('trash')}</button></div>`).join('')}</div>`).join('')}
async function decide(i,y){if(!confirm((y?t('del'):t('rjB'))+'?'))return;try{await api('admin/delreq/'+i,'POST',{ok:y})}catch(e){alert(t('err'))}go('admin')}
async function syncNow(){try{const r=await api('admin/sync','POST');alert(r.ok?t('ok'):t('err')+'\n'+r.sync.err)}catch(e){alert(t('err'))}go('admin')}
async function creds(){try{await api('admin/creds','POST',{login:$('#al').value,pw:$('#ap').value});alert(t('ok'))}catch(e){alert(t('err'))}}
async function delT(i){if(confirm(t('del')+'?')){await api('admin/tree/'+i,'DELETE');go(cur==='tree'?'home':cur)}}
